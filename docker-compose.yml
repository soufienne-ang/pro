version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: promosport
      MYSQL_USER: promosport
      MYSQL_PASSWORD: promosport123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://promosport:promosport123@db:3306/promosport"
      NODE_ENV: development
    volumes:
      - ./uploads:/app/uploads
      - ./.env:/app/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: